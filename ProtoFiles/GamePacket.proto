syntax = "proto3";

option csharp_namespace = "NeoSurvive.Network.Protocol";

// --- 공용 열거형 ---

enum ActionType {
  ATTACK = 0;
  SKILL = 1;
  NEURAL_LINK = 2;
  ITEM_PICKUP = 3;
  DAMAGE = 4;
  DEAD = 5;
  LEVEL_UP = 6;
  REVIVE = 7;
  WEAPON_EQUIP = 8;
  WEAPON_USE = 9;
  ENEMY_HIT = 10;
  ENEMY_DEAD = 11;
  PLAYER_HIT = 12;
  PLAYER_STATUS = 13;
  BUFF_APPLY = 14;
  BUFF_REMOVE = 15;
  OBJECT_INTERACT = 16;
  ENEMY_ATTACK = 17;
}

// --- 장비/무기 열거형 ---
enum WeaponType {
  WEAPON_UNSPECIFIED = 0;
  LINK_PISTOL = 1;
  PLASMA_RIFLE = 2;
  AI_DRONE = 3;
  AUTO_TURRET = 4;
  DATA_SCRAMBLER = 5;
  EMP_PULSE_GENERATOR = 6;
  HOLOGRAM_DECOY_GENERATOR = 7;
  NANO_WIRE_GENERATOR = 8;
  LASER_SWORD = 11;
  SURGE_BLADE = 12;
  ENERGY_SHIELD = 13;
  PLASMA_PHOTON = 14;
  GRAVITY_HAMMER = 15;
  BOOSTER_KNUCKLE = 16;
  TESLA_COIL_ARMOR = 17;
  BOLT_LAUNCHER = 18;
  CHAIN_SAW = 19;
  BLAST_BREATH = 20;
}

// --- 아이템/오브젝트 열거형 ---
enum ItemType {
  ITEM_UNSPECIFIED = 0;
  EXP_ORB = 1;
  PROJECTILE = 2;
  NEURAL_LINK_ITEM = 3;
  PSYCHO_INFECTION_ITEM = 4;
  GOLD = 5;
  CHEST = 6;
}

// --- 메시지 정의 ---

// [Periodic] 메인 패킷 컨테이너 (클라이언트-서버 통신용)
message GamePacket {
  oneof payload {
    PlayerMove player_move = 1;
    PlayerAction player_action = 2;
    GameSnapshot game_snapshot = 3;
    EnemyState enemy_state = 4;
    ItemState item_state = 5;
  }
}

// [Periodic] 플레이어 이동 데이터 (UDP 30Hz)
message PlayerMove {
  uint32 player_id = 1;
  int64 timestamp = 2;
  float pos_x = 3;
  float pos_y = 4;
  float vel_x = 5; // 추측 항법(Dead Reckoning)을 위한 속도
  float vel_y = 6;
  bool is_dead = 7; // 사망 여부
  float dir_x = 8;  // 이동/조준 방향
  float dir_y = 9;
  float speed = 10; // 이동 속도(스칼라)
}

// [Event] 플레이어 액션 및 상호작용 (Event-based)
message PlayerAction {
  uint32 player_id = 1;
  ActionType action_type = 2;
  uint32 target_id = 3;      // 대상 ID (적, 아이템 등)
  float pos_x = 4;           // 발생 위치
  float pos_y = 5;
  float dir_x = 6;           // 조준 방향
  float dir_y = 7;
  uint32 value = 8;          // 대미지, 스킬/아이템 고유 번호 등
  WeaponType weapon_type = 9; // 장비/무기 구분
  oneof weapon_payload {
    WeaponProjectile weapon_projectile = 10;
    WeaponBeam weapon_beam = 11;
    WeaponCone weapon_cone = 12;
    WeaponArea weapon_area = 13;
    WeaponSummon weapon_summon = 14;
    WeaponTrap weapon_trap = 15;
  }
}

// --- 플레이어 상태 / 버프 ---

message BuffState {
  uint32 buff_id = 1;
  uint32 stacks = 2;
  float remaining_time = 3;
  uint32 source_id = 4; // 시전자/오브젝트 ID
}

message PlayerStatus {
  uint32 player_id = 1;
  uint32 current_hp = 2;
  uint32 max_hp = 3;
  uint32 shield = 4;
  bool is_dead = 5;
  repeated BuffState buffs = 6;
}

// --- 무기 페이로드 ---

message WeaponProjectile {
  float spawn_x = 1;
  float spawn_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float speed = 5;
  float range = 6;
  uint32 penetration = 7;
  uint32 target_id = 8;
}

message WeaponBeam {
  float start_x = 1;
  float start_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float duration = 5;
  float speed = 6;
  uint32 penetration = 7;
}

message WeaponCone {
  float origin_x = 1;
  float origin_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float angle = 5;
  float range = 6;
  float status_duration = 7;
}

message WeaponArea {
  float center_x = 1;
  float center_y = 2;
  float radius = 3;
  float duration = 4;
  float tick_rate = 5;
  bool destroy_projectiles = 6;
}

message WeaponSummon {
  float spawn_x = 1;
  float spawn_y = 2;
  float duration = 3;
  uint32 hp = 4;
  bool spawn_prison = 5;
  float prison_duration = 6;
}

message WeaponTrap {
  float spawn_x = 1;
  float spawn_y = 2;
  float duration = 3;
  float activation_delay = 4;
  float tick_rate = 5;
  float radius = 6;
}

// [Snapshot] 적(Enemy) 상태 정보
message EnemyState {
  uint32 enemy_id = 1;
  uint32 type_id = 2;
  float pos_x = 3;
  float pos_y = 4;
  uint32 current_hp = 5;
  bool is_dead = 6;
  float dir_x = 7;
  float dir_y = 8;
  float vel_x = 9;
  float vel_y = 10;
}

// [Snapshot] 드롭 아이템(Item/ExpOrb) 정보
message ItemState {
  uint32 item_id = 1;
  uint32 type_id = 2;
  float pos_x = 3;
  float pos_y = 4;
  ItemType item_type = 5;
  float vel_x = 6;
  float vel_y = 7;
  float dir_x = 8;
  float dir_y = 9;
  uint32 owner_id = 10;
  uint32 quantity = 11;
  float remaining_time = 12;
  bool is_lootable = 13;
}

// [Periodic] 월드 스냅샷 (서버 브로드캐스트)
message GameSnapshot {
  int64 timestamp = 1;
  float game_time = 2;       // 동기화된 게임 시간
  repeated PlayerMove player_states = 3;
  repeated EnemyState enemy_states = 4;
  repeated ItemState item_states = 5;
  repeated PlayerStatus player_statuses = 6;
}