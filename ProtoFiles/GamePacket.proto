syntax = "proto3";

option csharp_namespace = "NeoSurvive.Network.Protocol";

// --- 공용 열거형 ---

enum ActionType {
  ATTACK = 0;
  SKILL = 1;
  NEURAL_LINK = 2;
  ITEM_PICKUP = 3;
  DAMAGE = 4;
  DEAD = 5;
  LEVEL_UP = 6;
  REVIVE = 7;
  WEAPON_EQUIP = 8;
  WEAPON_USE = 9;
  ENEMY_HIT = 10;
  ENEMY_DEAD = 11;
}

// --- 장비/무기 열거형 ---
enum WeaponType {
  WEAPON_UNSPECIFIED = 0;
  WEAPON_1 = 1;
  WEAPON_2 = 2;
}

// --- 메시지 정의 ---

// [Periodic] 메인 패킷 컨테이너 (클라이언트-서버 통신용)
message GamePacket {
  oneof payload {
    PlayerMove player_move = 1;
    PlayerAction player_action = 2;
    GameSnapshot game_snapshot = 3;
    EnemyState enemy_state = 4;
    ItemState item_state = 5;
  }
}

// [Periodic] 플레이어 이동 데이터 (UDP 30Hz)
message PlayerMove {
  uint32 player_id = 1;
  int64 timestamp = 2;
  float pos_x = 3;
  float pos_y = 4;
  float vel_x = 5; // 추측 항법(Dead Reckoning)을 위한 속도
  float vel_y = 6;
  bool is_dead = 7; // 사망 여부
}

// [Event] 플레이어 액션 및 상호작용 (Event-based)
message PlayerAction {
  uint32 player_id = 1;
  ActionType action_type = 2;
  uint32 target_id = 3;      // 대상 ID (적, 아이템 등)
  float pos_x = 4;           // 발생 위치
  float pos_y = 5;
  float dir_x = 6;           // 조준 방향
  float dir_y = 7;
  uint32 value = 8;          // 대미지, 스킬/아이템 고유 번호 등
  WeaponType weapon_type = 9; // 장비/무기 구분
  oneof weapon_payload {
    WeaponProjectilePayload weapon_projectile = 10;
    WeaponBeamPayload weapon_beam = 11;
    WeaponConePayload weapon_cone = 12;
    WeaponAreaPayload weapon_area = 13;
    WeaponSummonPayload weapon_summon = 14;
    WeaponTrapPayload weapon_trap = 15;
  }
}

// --- 무기 공격 페이로드 ---
message WeaponProjectilePayload {
  float spawn_x = 1;
  float spawn_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float speed = 5;
  float range = 6;
  uint32 penetration = 7;
  uint32 target_id = 8;
}

message WeaponBeamPayload {
  float start_x = 1;
  float start_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float duration = 5;
  float speed = 6;
  uint32 penetration = 7;
}

message WeaponConePayload {
  float origin_x = 1;
  float origin_y = 2;
  float dir_x = 3;
  float dir_y = 4;
  float angle = 5;
  float range = 6;
  float status_duration = 7;
}

message WeaponAreaPayload {
  float center_x = 1;
  float center_y = 2;
  float radius = 3;
  float duration = 4;
  float tick_rate = 5;
  bool destroy_projectiles = 6;
}

message WeaponSummonPayload {
  float spawn_x = 1;
  float spawn_y = 2;
  float duration = 3;
  float hp = 4;
  bool spawn_prison = 5;
  float prison_duration = 6;
}

message WeaponTrapPayload {
  float spawn_x = 1;
  float spawn_y = 2;
  float duration = 3;
  float activation_delay = 4;
  float tick_rate = 5;
  float radius = 6;
}

// [Snapshot] 적(Enemy) 상태 정보
message EnemyState {
  uint32 enemy_id = 1;
  uint32 type_id = 2;
  float pos_x = 3;
  float pos_y = 4;
  uint32 current_hp = 5;
}

// [Snapshot] 드롭 아이템(Item/ExpOrb) 정보
message ItemState {
  uint32 item_id = 1;
  uint32 type_id = 2;
  float pos_x = 3;
  float pos_y = 4;
}

// [Periodic] 월드 스냅샷 (서버 브로드캐스트)
message GameSnapshot {
  int64 timestamp = 1;
  float game_time = 2;       // 동기화된 게임 시간
  repeated PlayerMove player_states = 3;
  repeated EnemyState enemy_states = 4;
  repeated ItemState item_states = 5;
}